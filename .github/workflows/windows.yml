name: Windows build

on:
  push:
    branches: [build/full-app, windows/pip-app, feature/pip-app, main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  core:
    name: Rust core tests (shake, storage, AI client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri/core }
      - run: cargo test --manifest-path src-tauri/core/Cargo.toml

  installer:
    name: Windows installer
    runs-on: windows-latest
    needs: [web, core]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Build (unsigned) installer
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Pip-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
