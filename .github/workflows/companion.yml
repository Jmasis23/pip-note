name: Pip companion verification
on:
  push:
    branches: [feat/landmark-companion]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/core/Cargo.toml --locked
  windows:
    needs: portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: src-tauri}
      - run: npm ci
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Pip-companion-Windows-installer-unverified
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
